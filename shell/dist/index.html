<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AgentDock</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #12141a;
        color: #e8eaed;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        box-sizing: border-box;
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
      }
      .mark {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: #1c2028;
        color: #f3f4f6;
        font-weight: 700;
        font-size: 28px;
        letter-spacing: 0.04em;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 650;
      }
      #status {
        margin: 0;
        color: #9aa3b2;
        font-size: 15px;
        line-height: 1.5;
      }
      #error {
        display: none;
        margin: 16px 0 0;
        padding: 12px 14px;
        border-radius: 10px;
        background: #2a1518;
        color: #ffb4b4;
        font-size: 13px;
        line-height: 1.55;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="mark">AD</div>
        <h1>AgentDock</h1>
        <p id="status">正在启动引擎… / Starting engine…</p>
        <p id="error"></p>
      </div>
    </div>
    <script>
      window.__agentdockSetStatus = function (s) {
        var status = document.getElementById("status");
        var error = document.getElementById("error");
        if (!s) {
          return;
        }
        if (s.state === "error") {
          status.textContent = "引擎启动失败 / Engine failed to start";
          error.style.display = "block";
          var lines = [];
          if (s.message) {
            lines.push(s.message);
          }
          if (s.logPath) {
            lines.push(s.logPath);
          }
          error.textContent = lines.join("\n");
        } else {
          status.textContent =
            s.message || "正在启动引擎… / Starting engine…";
          error.style.display = "none";
          error.textContent = "";
        }
      };
    </script>
  </body>
</html>
