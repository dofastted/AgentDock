[package]
name = "agentdock"
version = "0.1.0"
description = "AgentDock Windows desktop shell"
authors = ["AgentDock"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "agentdock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
anyhow = "1.0"
auto-launch = "0.5"
dirs = "5.0"
log = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-log = "2.8"
tauri-plugin-window-state = "2.4"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "unwind"
strip = "symbols"
